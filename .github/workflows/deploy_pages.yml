name: Deploy Project Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "notebooks/**"
      - "run_pipeline.py"
      - ".github/workflows/deploy_pages.yml"
  workflow_run:
    workflows: ["Daily Lakehouse Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the nightly warehouse snapshot (build it if none is published yet)
        run: |
          python -c "import sys; from src.pipelines import snapshot; sys.exit(0 if snapshot.download() else 1)"             || (python run_pipeline.py ingest --no-ocr && python run_pipeline.py transform)

      - name: Generate site data (dictionary + status)
        run: python scripts/generate_site_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
