name: Daily Lakehouse Pipeline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "Fact rows to generate"
        default: "2000000"

concurrency:
  group: lakehouse-pipeline
  cancel-in-progress: true

permissions:
  contents: write  # publish the warehouse snapshot release asset

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sources and land them in bronze
        env:
          UPSTASH_KAFKA_REST_URL: ${{ secrets.UPSTASH_KAFKA_REST_URL }}
          UPSTASH_KAFKA_REST_USERNAME: ${{ secrets.UPSTASH_KAFKA_REST_USERNAME }}
          UPSTASH_KAFKA_REST_PASSWORD: ${{ secrets.UPSTASH_KAFKA_REST_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          SIM_TXNS_PER_DAY: "25"
        run: python run_pipeline.py ingest --rows "${{ github.event.inputs.rows || 2000000 }}" --no-ocr

      - name: Run notebooks (bronze -> silver -> gold, publish on green tests)
        run: python run_pipeline.py transform

      - name: Sync external warehouses
        if: ${{ vars.ENABLE_WAREHOUSE_SYNC == 'true' }}
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          echo '${{ secrets.GCP_SA_KEY_JSON }}' > /tmp/gcp-key.json 2>/dev/null || true
          pip install 'psycopg[binary]' google-cloud-bigquery || true
          python run_pipeline.py sync

      - name: Publish warehouse snapshot for the app and website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "from src.pipelines import snapshot; snapshot.pack()"
          gh release view warehouse-latest >/dev/null 2>&1 || gh release create warehouse-latest \
            --title "Warehouse snapshot (nightly)" --prerelease \
            --notes "Rebuilt every night by the pipeline. The Streamlit app downloads warehouse.duckdb.gz on a cold start."
          gh release upload warehouse-latest data/warehouse.duckdb.gz data/transform_meta.json --clobber
